<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical History</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="history-container">

    <h1>Medical History</h1>

    <div class="timeline">

        <div class="timeline-item">
            <div class="timeline-date">Jan 2026</div>
            <div class="timeline-content">
                <h3>Blood Test Report</h3>
                <p>Routine health checkup report uploaded.</p>
            </div>
        </div>

        <div class="timeline-item">
            <div class="timeline-date">Feb 2026</div>
            <div class="timeline-content">
                <h3>Doctor Prescription</h3>
                <p>Medication for fever and cold.</p>
            </div>
        </div>

        <div class="timeline-item">
            <div class="timeline-date">Mar 2026</div>
            <div class="timeline-content">
                <h3>X-Ray Scan</h3>
                <p>Chest scan for diagnosis.</p>
            </div>
        </div>

    </div>

    <button onclick="goToDashboard()">Back to Dashboard</button>

</div>

<script src="script.js"></script>
</body>
</html>
